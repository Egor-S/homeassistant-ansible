---
# From a fresh Home Assistant to a configured one, in one playbook.
#   ansible-playbook examples/site.yml -e hass_url=http://127.0.0.1:8123 -e vault_hass_password=...
# In real use, keep vault_hass_password in an Ansible Vault file instead of passing it with -e.
- name: Provision Home Assistant
  hosts: localhost
  gather_facts: false
  vars:
    hass_url: http://127.0.0.1:8123
  tasks:
    - name: Onboard
      egors.homeassistant.onboarding:
        url: "{{ hass_url }}"
        name: Admin
        username: admin
        password: "{{ vault_hass_password }}"

    - name: Log in
      egors.homeassistant.login:
        url: "{{ hass_url }}"
        username: admin
        password: "{{ vault_hass_password }}"
      register: hass_login
      no_log: true  # the result contains the token

    - name: Configure
      module_defaults:
        group/egors.homeassistant.all:
          url: "{{ hass_url }}"
          token: "{{ hass_login.token }}"
      block:
        - name: Core configuration
          egors.homeassistant.core_config:
            location_name: Cottage
            latitude: 59.9375
            longitude: 30.3086
            elevation: 12
            time_zone: Europe/Helsinki
            country: FI
            unit_system: metric

        - name: Areas
          egors.homeassistant.area:
            name: "{{ item.name }}"
            aliases: "{{ item.aliases | default(omit) }}"
            icon: "{{ item.icon | default(omit) }}"
          loop:
            - name: Hallway
              icon: mdi:door
            - name: Office
              aliases: [Study, Workroom]

        - name: Remove a default area
          egors.homeassistant.area:
            name: Bedroom
            state: absent
