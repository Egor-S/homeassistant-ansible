---
- name: Onboard Home Assistant
  egors.homeassistant.onboarding:
    url: "{{ ha_url }}"
    name: "{{ ha_owner_name }}"
    username: "{{ ha_owner_username }}"
    password: "{{ ha_owner_password }}"

- name: Log in
  egors.homeassistant.login:
    url: "{{ ha_url }}"
    username: "{{ ha_owner_username }}"
    password: "{{ ha_owner_password }}"
  register: setup_ha_login

- name: Expose connection facts
  ansible.builtin.set_fact:
    ha_url: "{{ ha_url }}"
    ha_token: "{{ setup_ha_login.token }}"
