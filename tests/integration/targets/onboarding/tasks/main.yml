---
- name: Wait for Home Assistant and read the onboarding status
  ansible.builtin.uri:
    url: "{{ ha_url }}/api/onboarding"
    return_content: true
    # 404: onboarded HA after a restart (the onboarding views are no longer registered).
    status_code: [200, 404]
  register: initial_status
  until: initial_status.status in [200, 404]
  retries: 60
  delay: 2

- name: Determine whether HA is fresh
  ansible.builtin.set_fact:
    ha_fresh: "{{ initial_status.status == 200 and not (initial_status.json | selectattr('step', 'equalto', 'user') | first).done }}"

- name: Fresh Home Assistant
  when: ha_fresh | bool
  block:
    - name: Log in before onboarding
      egors.homeassistant.login:
        url: "{{ ha_url }}"
        username: "{{ ha_owner_username }}"
        password: "{{ ha_owner_password }}"
      register: login_too_early
      ignore_errors: true

    - name: Onboard (check mode)
      egors.homeassistant.onboarding: &onboard_args
        url: "{{ ha_url }}"
        name: "{{ ha_owner_name }}"
        username: "{{ ha_owner_username }}"
        password: "{{ ha_owner_password }}"
      check_mode: true
      diff: true
      register: onboard_check

    - name: Read onboarding status after check mode
      ansible.builtin.uri:
        url: "{{ ha_url }}/api/onboarding"
      register: status_after_check

    - name: Login fails before onboarding, check mode reports changes without applying them
      ansible.builtin.assert:
        that:
          - login_too_early is failed
          - "'not onboarded' in login_too_early.msg"
          - onboard_check is changed
          - onboard_check.diff.before.steps.user == false
          - onboard_check.diff.after.steps.user == true
          - onboard_check.steps | dict2items | map(attribute='value') is all
          - status_after_check.json | selectattr('done') | list | length == 0

    - name: Onboard
      egors.homeassistant.onboarding: *onboard_args
      register: onboard

    - name: Read onboarding status after onboarding
      ansible.builtin.uri:
        url: "{{ ha_url }}/api/onboarding"
      register: status_after

    - name: Onboarding happened and returned no token
      ansible.builtin.assert:
        that:
          - onboard is changed
          - onboard.token is not defined
          - onboard.ha_version is defined
          - "onboard.steps == {'user': true, 'core_config': true, 'analytics': true, 'integration': true}"
          - status_after.json | rejectattr('done') | list | length == 0

- name: Onboard again
  egors.homeassistant.onboarding:
    url: "{{ ha_url }}"
    name: "{{ ha_owner_name }}"
    username: "{{ ha_owner_username }}"
    password: "{{ ha_owner_password }}"
  register: onboard_again

- name: Second run is idempotent
  ansible.builtin.assert:
    that:
      - onboard_again is not changed
      - onboard_again.token is not defined

- name: Invalid client_id is rejected
  egors.homeassistant.onboarding:
    url: "{{ ha_url }}"
    name: "{{ ha_owner_name }}"
    username: "{{ ha_owner_username }}"
    password: "{{ ha_owner_password }}"
    client_id: foo
  register: onboard_bad_client_id
  ignore_errors: true

- name: Invalid client_id fails
  ansible.builtin.assert:
    that:
      - onboard_bad_client_id is failed
      - "'client_id' in onboard_bad_client_id.msg"
