services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ha-config:/config
    healthcheck:
      # /api/onboarding is gone after a restart of an onboarded instance; the frontend manifest is always served.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/manifest.json >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  ha-config:
